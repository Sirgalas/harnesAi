spring:
  application:
    name: harness
  main:
    # Агент живёт в терминале, а не в вебе: без этого Boot поднял бы сервлет-контейнер,
    # если веб-стартер притянется транзитивно.
    web-application-type: none
    banner-mode: off
  ai:
    ollama:
      base-url:

logging:
  level:
    root: WARN
    com.harness: INFO
  pattern:
    console: "%msg%n"